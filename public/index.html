<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhatsApp Bot — Pair Device</title>
<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --accent:#00a884; --accent-dark:#008f6f;
    --text:#e9edef; --muted:#8696a0; --danger:#f15c6d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at top, #14262b, var(--bg));
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); padding:20px;
  }
  .card{
    background:var(--panel); border-radius:16px; padding:36px 32px; width:100%; max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); text-align:center;
  }
  .logo{width:56px;height:56px;margin:0 auto 12px}
  h1{font-size:1.3rem; margin:0 0 4px}
  p.sub{color:var(--muted); font-size:.9rem; margin:0 0 28px}
  input{
    width:100%; padding:14px 16px; border-radius:10px; border:1px solid #2a3942;
    background:#202c33; color:var(--text); font-size:1rem; outline:none; margin-bottom:14px;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%; padding:14px; border:none; border-radius:10px; background:var(--accent);
    color:#04120e; font-weight:600; font-size:1rem; cursor:pointer; transition:.15s;
  }
  button:hover{background:var(--accent-dark)}
  button:disabled{opacity:.6; cursor:not-allowed}
  .code-box{
    margin-top:24px; padding:20px; border-radius:12px; background:#0b141a; border:1px dashed var(--accent);
    display:none;
  }
  .code{
    font-size:2rem; letter-spacing:6px; font-weight:700; color:var(--accent); font-family:monospace;
  }
  .steps{text-align:left; color:var(--muted); font-size:.82rem; margin-top:16px; line-height:1.6}
  .error{color:var(--danger); font-size:.85rem; margin-top:10px; display:none}
  .status{margin-top:18px; font-size:.8rem; color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
  .dot.on{background:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 24 24" fill="#00a884"><path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.76.46 3.45 1.34 4.95L2 22l5.2-1.36A9.94 9.94 0 0 0 12.04 22c5.52 0 10-4.48 10-10s-4.48-10-10-10zm0 18.16c-1.6 0-3.15-.43-4.5-1.24l-.32-.19-3.08.81.82-3-.21-.31A8.15 8.15 0 0 1 3.84 12c0-4.53 3.68-8.2 8.2-8.2 4.53 0 8.2 3.67 8.2 8.2 0 4.52-3.67 8.16-8.2 8.16z"/></svg>
    <h1>Pair Your WhatsApp</h1>
    <p class="sub">Enter your number to get an 8-digit pairing code — no QR, no session string.</p>

    <input type="tel" id="phone" placeholder="e.g. 94771234567 (with country code)" />
    <button id="pairBtn" onclick="requestCode()">Get Pairing Code</button>
    <div class="error" id="errorMsg"></div>

    <div class="code-box" id="codeBox">
      <div class="code" id="codeText">— — — —</div>
      <div class="steps">
        1. Open WhatsApp on your phone<br/>
        2. Go to <b>Settings → Linked Devices → Link a Device</b><br/>
        3. Tap <b>Link with phone number instead</b><br/>
        4. Enter the code above
      </div>
    </div>

    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking status…</span></div>
  </div>

<script>
async function requestCode(){
  const phone = document.getElementById('phone').value.trim();
  const btn = document.getElementById('pairBtn');
  const errBox = document.getElementById('errorMsg');
  const codeBox = document.getElementById('codeBox');
  errBox.style.display = 'none';

  if(!phone){
    errBox.textContent = 'Please enter your phone number with country code.';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Generating code…';

  try{
    const res = await fetch('/api/pair', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ number: phone })
    });
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || 'Failed to generate pairing code');
    }

    document.getElementById('codeText').textContent = data.code;
    codeBox.style.display = 'block';
    btn.textContent = 'Code Generated ✓';
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Get Pairing Code';
  }
}

async function pollStatus(){
  try{
    const res = await fetch('/api/status');
    const data = await res.json();
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if(data.status === 'connected'){
      dot.classList.add('on');
      text.textContent = 'Connected ✓';
    } else if(data.status === 'connecting'){
      dot.classList.remove('on');
      text.textContent = 'Connecting…';
    } else {
      dot.classList.remove('on');
      text.textContent = 'Not connected';
    }
  }catch(e){}
}
pollStatus();
setInterval(pollStatus, 3000);
</script>
</body>
</html>
